<!DOCTYPE html>
<html>
<title>Plagiarism Checker</title>
<style>
    body {
        padding: 20px;
    }
    button {
        width: 100%;
        border: none;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        background-color: #6f9eef;
        border-radius: 15px;
    }
    textarea {
        color: black;
        background-color: rgb(248, 246, 246);
        min-width: 500px;
        width: 100%;
        min-height: 300px;
        height: 40%;
        font-size: 11px;
        resize: none;
        border-radius: 15px;
    }
    .center {
        background-color:rgb(237, 234, 234);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        margin: 0 auto;
        max-width: 800px;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
    }
    @media (max-width: 600px) {
        .center {
            width: 90%;
        }
    }
</style>
<body>
    <br>
    <div class="center">
        <h2>Plagiarism Checker</h2>

        <form action="/report" method="POST">
        <p>Paste your text here:</p><br>
        <textarea for="fname" name="text"></textarea>
        <br>
        <button type="Submit" value="Send">Generate Report</button>
        </form>

    </div>
</body>
</html>
