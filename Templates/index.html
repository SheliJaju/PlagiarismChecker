<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plagiarism Checker</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 700px;
      width: 100%;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #4a56e2;
      font-size: 1.8em;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #444;
    }

    textarea {
      width: 95%;
      min-height: 180px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #848be2;
      box-shadow: 0 0 0 3px rgba(74, 86, 226, 0.1);
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }

    .divider::before {
      left: 0;
    }
    .divider::after {
      right: 0;
    }

    .divider span {
      background: white;
      padding: 0 10px;
      color: #666;
      font-size: 0.9em;
    }

    .file-upload {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-upload label {
      background: #848be2;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .file-upload label:hover {
      background: #3843c8;
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      font-size: 0.95em;
      color: #666;
      font-style: italic;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #848be2;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #3843c8;
    }

    .info {
      margin-top: 20px;
      font-size: 0.9em;
      color: #555;
      line-height: 1.5;
      background: #f9f9ff;
      padding: 12px 15px;
      border-radius: 8px;
    }

    .info strong {
      color: #848be2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Plagiarism Checker</h1>
    <form action="/report" method="POST" enctype="multipart/form-data">
      <label for="text">Paste your text:</label>
      <textarea
        id="text"
        name="text"
        placeholder="Enter or paste text to check for plagiarism..."
      ></textarea>

      <div class="divider"><span>OR</span></div>

      <div class="file-upload">
        <label for="file">Choose File</label>
        <input
          type="file"
          name="file"
          id="file"
          accept=".pdf,.docx,.txt"
          onchange="updateFileName(this)"
        />
        <span class="file-name" id="file-name">No file chosen</span>
      </div>

      <button type="submit">Check for Plagiarism</button>

      <div class="info">
        <p><strong>Supported formats:</strong> PDF, DOCX, TXT</p>
        <p><strong>Tip:</strong> Either paste text or upload a document to analyze.</p>
      </div>
    </form>
  </div>

  <script>
    function updateFileName(input) {
      const fileName = input.files[0]?.name || "No file chosen";
      document.getElementById("file-name").textContent = fileName;
    }
  </script>
</body>
</html>
